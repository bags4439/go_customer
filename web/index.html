<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge"
        http-equiv="X-UA-Compatible">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="Whiplyn">
  <meta name="theme-color"
        content="#F5F4F0">

  <meta name="mobile-web-app-capable"
        content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="default">
  <meta name="apple-mobile-web-app-title"
        content="Whiplyn">
  <link rel="apple-touch-icon"
        href="icons/Icon-192.png">

  <link rel="icon"
        type="image/png"
        href="favicon.png"/>

  <title>Whiplyn</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --whiplyn-brand: #2563A8;
      --whiplyn-surface: #F5F4F0;
      --whiplyn-text: #1A1A18;
      --whiplyn-text-secondary: #666666;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: var(--whiplyn-surface);
    }

    #flutter-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
      background-color: var(--whiplyn-surface);
      transition: opacity 280ms ease-out;
    }

    #flutter-splash.flutter-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #flutter-splash .flutter-splash__brand {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }

    #flutter-splash .flutter-splash__mark {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 12px;
    }

    #flutter-splash .flutter-splash__name {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--whiplyn-brand);
    }

    #flutter-splash .flutter-splash__progress {
      margin-top: 24px;
      width: min(240px, calc(100vw - 40px));
    }

    #flutter-splash .flutter-splash__progress-track {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background-color: rgba(37, 99, 168, 0.15);
    }

    #flutter-splash .flutter-splash__progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background-color: var(--whiplyn-brand);
      transition: width 280ms ease-out;
    }

    #flutter-splash .flutter-splash__progress-label {
      margin: 8px 0 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
      text-align: center;
      color: var(--whiplyn-text-secondary);
    }
  </style>

  <!-- OneSignal Web SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
          defer></script>
  <script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "9a05e7b1-ca1c-4de2-b521-a175c1d66e34",
      safari_web_id: "web.onesignal.auto.364542e4-0165-4e49-b6eb-0136f3f4eaa9",
      notifyButton: {
        enable: true,
      },
      allowLocalhostAsSecureOrigin: true,
    });
  });

    function oneSignalLoginWeb(userId) {
      OneSignalDeferred.push(
          function(OneSignal) {
        OneSignal.login(userId);
      });
    }

    function oneSignalLogoutWeb() {
      OneSignalDeferred.push(
          function(OneSignal) {
        OneSignal.logout();
      });
    }

    function oneSignalRequestPermissionWeb() {
      OneSignalDeferred.push(
          function(OneSignal) {
        OneSignal.Notifications
            .requestPermission();
      });
    }
  </script>
</head>
<body>
  <div id="flutter-splash"
       aria-label="Loading Whiplyn"
       role="status"
       aria-live="polite">
    <div class="flutter-splash__brand">
      <img class="flutter-splash__mark"
           src="icons/app_icon.png"
           alt=""
           width="40"
           height="40" />
      <p class="flutter-splash__name">Whiplyn</p>
    </div>
    <div class="flutter-splash__progress">
      <div class="flutter-splash__progress-track"
           aria-hidden="true">
        <div class="flutter-splash__progress-fill"
             id="flutter-splash-progress-fill"></div>
      </div>
      <p class="flutter-splash__progress-label"
         id="flutter-splash-progress-label"
         aria-label="Loading 0 percent">0%</p>
    </div>
  </div>

  <script>
    window.setFlutterSplashProgress = function (percent) {
      var clamped = Math.max(0, Math.min(100, Math.round(percent)));
      var fill = document.getElementById('flutter-splash-progress-fill');
      var label = document.getElementById('flutter-splash-progress-label');
      if (fill) {
        fill.style.width = clamped + '%';
      }
      if (label) {
        label.textContent = clamped + '%';
        label.setAttribute('aria-label', 'Loading ' + clamped + ' percent');
      }
    };

    function removeFlutterSplash() {
      var splash = document.getElementById('flutter-splash');
      if (!splash || splash.classList.contains('flutter-splash-hidden')) {
        return;
      }
      window.setFlutterSplashProgress(100);
      splash.classList.add('flutter-splash-hidden');
      window.setTimeout(function () {
        splash.remove();
      }, 320);
    }

    window.addEventListener('flutter-first-frame', removeFlutterSplash);
    window.setTimeout(removeFlutterSplash, 15000);
  </script>

  <script>
    function openPaystackCheckoutPopup(url) {
      const width = 520;
      const height = 720;
      const left = Math.max(0, Math.round((screen.width - width) / 2));
      const top = Math.max(0, Math.round((screen.height - height) / 2));
      const features = [
        'popup=yes',
        'width=' + width,
        'height=' + height,
        'left=' + left,
        'top=' + top,
        'scrollbars=yes',
        'resizable=yes',
      ].join(',');
      const popup = window.open(url, 'paystack_checkout', features);
      return !!(popup && !popup.closed);
    }
  </script>
  <script src="flutter_bootstrap.js"
          async></script>
</body>
</html>
